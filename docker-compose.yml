services:
  db:
    image: postgres:15-alpine
    container_name: nnkienn_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: nnkienn_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/portfolio_db
      CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
      UPLOAD_ROOT: /app/uploads
    ports:
      - "8001:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: nnkienn_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  postgres_data:
